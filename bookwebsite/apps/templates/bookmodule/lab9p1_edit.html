{% extends "layouts/base2.html" %}

{% block title %} Edit Book {% endblock title %}

{% block content %}
<h1>Edit Book</h1>

<form method="post" action="">
    {% csrf_token %}

    <p>
        <label>Title:</label>
        <input type="text" name="title" value="{{ book.title }}" required />
    </p>
    <p>
        <label>Author:</label>
        <input type="text" name="author" value="{{ book.author }}" required />
    </p>
    <p>
        <label>Price:</label>
        <input type="number" step="0.01" name="price" value="{{ book.price }}" required />
    </p>
    <p>
        <label>Edition:</label>
        <input type="number" name="edition" value="{{ book.edition }}" required />
    </p>

    <button type="submit">Update</button>
    <a href="{% url 'lab9p1_listbooks' %}">Cancel</a>
</form>
{% endblock content %}
